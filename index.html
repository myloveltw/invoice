<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5fbf">
<title>거래명세표</title>
<!-- 아이폰: 홈 화면에 추가하면 주소창 없이 앱처럼 열림 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="거래명세표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --fg:#17202e; --muted:#5f6b7c; --line:#d9dee7;
    --accent:#1f5fbf; --accent-fg:#fff; --ok:#13804a; --warn:#9a6200; --warn-bg:#fff6e0; --err:#c0392b; --err-bg:#fdecea;
    --field:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11151c; --card:#1a2029; --fg:#e8edf4; --muted:#9aa6b6; --line:#2c3542;
      --accent:#5b9bff; --accent-fg:#0b1220; --ok:#4cc38a; --warn:#f0b65a; --warn-bg:#2b2416; --err:#ff7b6e; --err-bg:#2d1a18; --field:#141a22; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 120px calc(12px + env(safe-area-inset-left))}
  button{-webkit-tap-highlight-color:transparent}
  header{padding:6px 2px 10px}
  h1{font-size:21px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
  input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 11px}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea{min-height:92px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  button{font:inherit;border:0;border-radius:10px;padding:12px 14px;font-weight:600;cursor:pointer}
  .btn{background:var(--accent);color:var(--accent-fg)}
  .btn-ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .btn-sm{padding:7px 11px;font-size:14px;border-radius:8px}
  .btn-block{width:100%}
  .row-btns{display:flex;gap:8px;flex-wrap:wrap}
  .row-btns>button{flex:1 1 auto}
  .msg{border-radius:9px;padding:9px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
  .msg.warn{background:var(--warn-bg);color:var(--warn)}
  .msg.err{background:var(--err-bg);color:var(--err)}
  .msg.ok{background:transparent;color:var(--ok);padding:4px 0}
  .hint{color:var(--muted);font-size:12.5px;margin-top:6px}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  .item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
  .item-top b{color:var(--fg);font-variant-numeric:tabular-nums}
  .del{background:transparent;color:var(--err);padding:4px 8px;font-size:13px;border:1px solid var(--line);border-radius:7px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:8px}
  details[open] summary{margin-bottom:8px}
  .totals{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;font-variant-numeric:tabular-nums}
  .totals dd{margin:0;text-align:right}
  .totals dt{color:var(--muted)}
  .totals .grand{font-weight:700;font-size:17px}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:10px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:560px;margin:0 auto}
  .result{border:2px solid var(--ok)}
  .result .fname{word-break:break-all;font-weight:600}
  #r-where{white-space:pre-line}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px}
  .tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  [hidden]{display:none!important}
  /* 태블릿 가로 등 넓은 화면: 왼쪽(설정·붙여넣기) / 오른쪽(품목·합계·결과) 두 칸 */
  @media (min-width: 900px){
    .wrap{max-width:1240px;padding:16px 24px 120px}
    .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
    .bar .inner{max-width:1240px;display:flex;justify-content:flex-end}
    .bar .btn-block{width:calc(50% - 8px)}
    textarea#paste{min-height:220px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>거래명세표</h1>
    <p class="sub">카톡 문장 붙여넣기 → 엑셀 거래명세표 (PC 버전과 같은 서식)</p>
  </header>

  <div class="cols">
  <div class="col-l">
  <section class="card">
    <div class="grid2 field">
      <div><label for="date">작성일</label><input type="date" id="date"></div>
      <div><label for="vat">세율 (%)</label><input type="number" id="vat" inputmode="decimal" value="10" min="0" max="100" step="0.1"></div>
    </div>
    <div class="field">
      <label for="template">서식</label>
      <select id="template"></select>
    </div>
    <div class="field">
      <label for="partner">거래처 <span style="font-weight:normal">(뒤에 貴中 자동)</span></label>
      <input type="text" id="partner" placeholder="예: 파워렉스코리아" autocomplete="off">
    </div>
    <details id="sup-box">
      <summary>우리 회사 정보 (공급자) <span id="sup-state"></span></summary>
      <div class="hint" style="margin:0 0 8px">한 번 입력하면 이 휴대폰에만 저장됩니다. 비운 칸은 서식에 적힌 그대로 나갑니다.</div>
      <div class="grid2 field">
        <div><label for="sup-name">상호</label><input id="sup-name" data-sup="name" autocomplete="off"></div>
        <div><label for="sup-ceo">성명 (대표)</label><input id="sup-ceo" data-sup="ceo" autocomplete="off"></div>
      </div>
      <div class="field"><label for="sup-regno">등록번호</label><input id="sup-regno" data-sup="regno" inputmode="numeric" placeholder="000-00-00000" autocomplete="off"></div>
      <div class="field"><label for="sup-addr">사업장주소</label><input id="sup-addr" data-sup="addr" autocomplete="off"></div>
      <div class="grid2 field">
        <div><label for="sup-biz">업태</label><input id="sup-biz" data-sup="biz" placeholder="제 조" autocomplete="off"></div>
        <div><label for="sup-kind">종목</label><input id="sup-kind" data-sup="kind" autocomplete="off"></div>
      </div>
      <div class="grid2 field">
        <div><label for="sup-tel">전화번호</label><input id="sup-tel" data-sup="tel" inputmode="tel" placeholder="031-000-0000 / 031-000-0000" autocomplete="off"></div>
        <div><label for="sup-email">이메일</label><input id="sup-email" data-sup="email" inputmode="email" autocomplete="off"></div>
      </div>
    </details>
  </section>

  <section class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-paste" aria-selected="true">카톡에서 붙여넣기</button>
      <button role="tab" id="tab-manual" aria-selected="false">직접 입력</button>
    </div>
    <div id="pane-paste">
      <textarea id="paste" placeholder="파워렉스코리아.SL5600A승강장링크핀지지블럭.800x2500&#10;일신이엔지.Base,용접₩350000"></textarea>
      <div class="row-btns" style="margin-top:8px">
        <button class="btn-ghost btn-sm" id="btn-clip">📋 클립보드에서 붙여넣기</button>
        <button class="btn-ghost btn-sm" id="btn-clear">지우기</button>
      </div>
      <div class="hint"><b>거래처.품명.수량x단가</b> · <b>거래처.품명₩금액</b> · <b>거래처.품명₩단가x수량</b> · 한 줄에 이어 써도 됩니다 (<b>거래처.품명A.10x100.품명B₩5000</b>)</div>
      <div id="paste-msg"></div>
    </div>
    <div id="pane-manual" hidden>
      <div class="hint" style="margin-top:0">아래 [+ 품목 추가] 로 한 줄씩 입력하세요. 품명·단가는 필수입니다. 수량을 비우면 단가 칸의 값이 금액으로 들어갑니다 (규격·수량·단가 칸은 비움).</div>
    </div>
  </section>

  </div>
  <div class="col-r">
  <section class="card">
    <h2><span>품목 <span id="count" style="color:var(--muted);font-weight:normal"></span></span>
      <button class="btn-ghost btn-sm" id="btn-add">+ 품목 추가</button></h2>
    <div id="items"></div>
    <dl class="totals" id="totals"></dl>
  </section>

  <section class="card result" id="result" hidden>
    <h2>✅ 만들었습니다</h2>
    <div class="fname" id="r-name"></div>
    <div class="hint" id="r-where"></div>
    <div class="row-btns" style="margin-top:10px">
      <button class="btn btn-sm" id="btn-open">열기</button>
      <button class="btn btn-sm" id="btn-share">공유 (카톡 등)</button>
      <button class="btn-ghost btn-sm" id="btn-save">다시 저장</button>
    </div>
  </section>

  <div id="gen-msg"></div>
  </div>
  </div>
</div>

<div class="bar"><div class="inner">
  <button class="btn btn-block" id="btn-gen">거래명세표 만들기</button>
</div></div>

    var is = this.el('is'), t = this.el('t');
    t.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', 'preserve');
    t.appendChild(this.doc.createTextNode(String(s)));
    is.appendChild(t); cell.appendChild(is);
  };
  Sheet.prototype.setFormula = function (r, c, formula, cached) {
    var cell = this.getCell(r, c, true);
    this.clear(cell);
    var f = this.el('f'); f.appendChild(this.doc.createTextNode(formula.replace(/^=/, ''))); cell.appendChild(f);
    if (cached != null && cached !== '') {
      if (typeof cached === 'string') cell.setAttribute('t', 'str');
      var v = this.el('v'); v.appendChild(this.doc.createTextNode(String(cached))); cell.appendChild(v);
    }
  };
  Sheet.prototype.clearValue = function (r, c) { var cell = this.getCell(r, c, false); if (cell) this.clear(cell); };

  // ---------- 병합 ----------
  Sheet.prototype.mergeEls = function () {
    var mc = this.child(this.root, 'mergeCells');
    return mc ? this.children(mc, 'mergeCell') : [];
  };
  Sheet.prototype.merges = function () {
    return this.mergeEls().map(function (m) {
      var p = m.getAttribute('ref').split(':'), a = splitRef(p[0]), b = splitRef(p[1] || p[0]);
      return { r1: a.row, c1: a.col, r2: b.row, c2: b.col };
    });
  };
  Sheet.prototype.mergeAt = function (r, c) {
    var ms = this.merges();
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (m.r1 <= r && r <= m.r2 && m.c1 <= c && c <= m.c2) return m;
    }
    return null;
  };

  // ---------- 행 삽입 (at 행 앞에 n 행, 서식은 srcRow 를 복사) ----------
  function shiftFormula(f, at, n) {
    return f.replace(/(^|[^A-Za-z_\d$])(\$?)([A-Z]{1,3})(\$?)(\d+)(?![\d(A-Za-z_])/g, function (all, pre, d1, col, d2, row) {
      row = +row;
      return pre + d1 + col + d2 + (row >= at ? row + n : row);
    });
  }
  Sheet.prototype.insertRows = function (at, n, srcRow) {
    var self = this;
    // 1) 아래 행 번호 밀기 (아래에서부터)
    var nums = Object.keys(this.rows).map(Number).filter(function (r) { return r >= at; }).sort(function (a, b) { return b - a; });
    nums.forEach(function (r) {
      var row = self.rows[r];
      delete self.rows[r];
      row.setAttribute('r', String(r + n));
      self.children(row, 'c').forEach(function (cell) {
        var p = splitRef(cell.getAttribute('r'));
        cell.setAttribute('r', ref(p.row + n, p.col));
      });
      self.rows[r + n] = row;
    });
    // 2) 모든 수식의 행 참조 밀기
    var fs = this.root.getElementsByTagNameNS(this.ns, 'f');
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i];
      if (f.firstChild) f.firstChild.nodeValue = shiftFormula(f.textContent, at, n);
      var fr = f.getAttribute('ref');
      if (fr) f.setAttribute('ref', shiftFormula(fr, at, n));
    }
    // 3) 병합 밀기
    var src = this.rows[srcRow];
    var srcMerges = [];
    this.mergeEls().forEach(function (m) {
      var p = m.getAttribute('ref').split(':'), a = splitRef(p[0]), b = splitRef(p[1] || p[0]);
      if (a.row === srcRow && b.row === srcRow) srcMerges.push([a.col, b.col]);
      if (a.row >= at) a.row += n;
      if (b.row >= at) b.row += n;
      m.setAttribute('ref', ref(a.row, a.col) + ':' + ref(b.row, b.col));
    });
    // 4) 새 행 만들기 (원본 행의 서식/높이 복사, 값은 비움)
    var mcParent = this.child(this.root, 'mergeCells');
    for (var k = 0; k < n; k++) {
      var r = at + k;
      var row = src.cloneNode(true);
      row.setAttribute('r', String(r));
      this.children(row, 'c').forEach(function (cell) {
        var p = splitRef(cell.getAttribute('r'));
        cell.setAttribute('r', ref(r, p.col));
        self.clear(cell);
      });
      var before = null;
      for (var x = this.sheetData.firstChild; x; x = x.nextSibling)
        if (x.nodeType === 1 && +x.getAttribute('r') > r) { before = x; break; }
      this.sheetData.insertBefore(row, before);
      this.rows[r] = row;
      srcMerges.forEach(function (cc) {
        var m = self.el('mergeCell');
        m.setAttribute('ref', ref(r, cc[0]) + ':' + ref(r, cc[1]));
        mcParent.appendChild(m);
      });
    }
    if (mcParent) mcParent.setAttribute('count', String(this.mergeEls().length));
    // 5) dimension / 인쇄 행 나누기
    var dim = this.child(this.root, 'dimension');
    if (dim) dim.setAttribute('ref', shiftFormula(dim.getAttribute('ref'), at, n));
    var rb = this.child(this.root, 'rowBreaks');
    if (rb) this.children(rb, 'brk').forEach(function (b) { var id = +b.getAttribute('id'); if (id >= at) b.setAttribute('id', String(id + n)); });
  };

  // ---------- 레이아웃 탐지 ----------
  var CELL_REF_RE = /\$?([A-Z]{1,3})\$?(\d+)/g;

  function detectLayout(sh) {
    var maxRow = sh.maxRow();
    var headerRows = [];
    for (var r = 1; r <= maxRow; r++) {
      var row = sh.rows[r];
      if (!row) continue;
      var cells = sh.children(row, 'c');
      for (var i = 0; i < cells.length; i++) {
        var p = splitRef(cells[i].getAttribute('r'));
        if (norm(sh.text(p.row, p.col)) === '월일') { headerRows.push(r); break; }
      }
    }
    if (!headerRows.length) throw new Error("서식에서 '월일' 헤더를 찾지 못했습니다.");
    var blocks = [], prevTotal = 0;
    headerRows.slice(0, 2).forEach(function (hrow, idx) {
      var b = { headerRow: hrow, topRow: idx === 0 ? 1 : prevTotal + 1, col: {}, span: {} };
      sh.children(sh.rows[hrow], 'c').forEach(function (cell) {
        var c = splitRef(cell.getAttribute('r')).col;
        var t = norm(sh.text(hrow, c));
        if (!t) return;
        var m = sh.mergeAt(hrow, c);
        var start = m ? m.c1 : c, end = m ? m.c2 : c;
        Object.keys(FIELD_LABEL).forEach(function (f) {
          if (b.col[f]) return;
          if (FIELD_LABEL[f].some(function (lb) { return norm(lb) === t; })) { b.col[f] = start; b.span[f] = [start, end]; }
        });
      });
      var missing = ['date', 'item', 'qty', 'price'].filter(function (f) { return !b.col[f]; });
      if (missing.length) throw new Error('품목표 헤더 인식 실패: ' + missing.join(', '));
      b.itemStart = hrow + 1;
      b.totalRow = 0;
      for (var rr = hrow + 1; rr <= Math.min(hrow + 60, maxRow); rr++) {
        if (norm(sh.text(rr, 1)).indexOf('합계금액') === 0) { b.totalRow = rr; break; }
      }
      if (!b.totalRow) throw new Error("서식에서 '합계금액' 행을 찾지 못했습니다.");
      b.itemEnd = b.totalRow - 1;
      b.capacity = b.itemEnd - b.itemStart + 1;
      // 작성일 셀: 품목 '월일' 수식(=$A$4)이 가리키는 곳, 없으면 위쪽 날짜 숫자
      b.dateCell = null;
      for (rr = b.itemStart; rr <= b.itemEnd && !b.dateCell; rr++) {
        var v = sh.value(rr, b.col.date);
        if (v && typeof v === 'object') {
          CELL_REF_RE.lastIndex = 0;
          var mm = CELL_REF_RE.exec(v.formula);
          if (mm && +mm[2] < hrow && +mm[2] >= b.topRow) b.dateCell = { row: +mm[2], col: colToNum(mm[1]) };
        }
      }
      if (!b.dateCell) {
        for (rr = hrow - 1; rr >= b.topRow; rr--) {
          var dv = sh.value(rr, 1);
          if ((typeof dv === 'number' && dv > 30000) || (dv && typeof dv === 'object' && +dv.cached > 30000)) { b.dateCell = { row: rr, col: 1 }; break; }
        }
      }
      // 거래처 셀: '아래와 같이 계산합니다' 두 줄 위
      b.partnerCell = null;
      for (rr = b.topRow; rr < hrow && !b.partnerCell; rr++) {
        if (norm(sh.text(rr, 1)).indexOf('아래와같이계산합니다') >= 0 && rr - 2 >= b.topRow) b.partnerCell = { row: rr - 2, col: 1 };
      }
      if (!b.partnerCell && b.dateCell) b.partnerCell = { row: b.dateCell.row + 2, col: 1 };
      // 합계금액(공급가액+세액) 셀: 합계행의 공급가액/세액을 모두 참조하는 수식
      b.grandCell = null;
      if (b.col.amount && b.col.vat) {
        var want = [ref(b.totalRow, b.col.amount), ref(b.totalRow, b.col.vat)];
        for (rr = b.topRow; rr < hrow && !b.grandCell; rr++) {
          if (!sh.rows[rr]) continue;
          sh.children(sh.rows[rr], 'c').forEach(function (cell) {
            if (b.grandCell) return;
            var f = sh.child(cell, 'f');
            if (!f) return;
            var refs = (f.textContent.replace(/\$/g, '').match(/[A-Z]{1,3}\d+/g) || []);
            if (want.every(function (w) { return refs.indexOf(w) >= 0; }) ||
                (idx > 0 && refs.length === 1 && blocks[0] && blocks[0].grandCell && refs[0] === ref(blocks[0].grandCell.row, blocks[0].grandCell.col)))
              b.grandCell = splitRef(cell.getAttribute('r'));
          });
        }
      }
      prevTotal = b.totalRow;
      blocks.push(b);
    });
    return blocks;
  }

  // ---------- 공급자(우리 회사) 정보 ----------
  // 서식의 '등록번호' 같은 글자 칸을 찾아 (병합된 끝) 바로 오른쪽 칸에 넣는다. 위·아래 장 모두.
  // 값이 빈 항목은 서식에 적힌 그대로 둔다.
  var SUPPLIER_LABEL = { regno: '등록번호', name: '상호', ceo: '성명', addr: '사업장주소', biz: '업태', kind: '종목', tel: '전화번호' };
  function fillSupplier(sh, sup) {
    if (!sup) return 0;
    var n = 0, maxRow = sh.maxRow();
    for (var r = 1; r <= maxRow; r++) {
      var row = sh.rows[r];
      if (!row) continue;
      sh.children(row, 'c').forEach(function (cell) {
        var c = splitRef(cell.getAttribute('r')).col, t = norm(sh.text(r, c));
        Object.keys(SUPPLIER_LABEL).forEach(function (k) {
          if (t !== SUPPLIER_LABEL[k] || sup[k] == null || String(sup[k]).trim() === '') return;
          var m = sh.mergeAt(r, c);
          sh.setText(r, (m ? m.c2 : c) + 1, String(sup[k]).replace(/\r?\n/g, '\r\n'));
          n++;
        });
      });
    }
    return n;
  }

  // ---------- 채우기 ----------
  function fillMain(sh, b, items, docDate, partner, vatRate) {
    var serial = excelSerial(docDate);
    if (b.dateCell) sh.setNumber(b.dateCell.row, b.dateCell.col, serial);
    if (b.partnerCell) sh.setText(b.partnerCell.row, b.partnerCell.col, mergePartnerName(sh.text(b.partnerCell.row, b.partnerCell.col), partner));
    var C = b.col, qc = numToCol(C.qty), pc = numToCol(C.price), ac = C.amount ? numToCol(C.amount) : null;
    var dateAbs = b.dateCell ? '$' + numToCol(b.dateCell.col) + '$' + b.dateCell.row : null;
    var supply = 0, vatSum = 0;
    for (var r = b.itemStart; r <= b.itemEnd; r++) {
      var it = items[r - b.itemStart];
      if (!it) { Object.keys(C).forEach(function (f) { sh.clearValue(r, C[f]); }); continue; }
      if (it.date) sh.setNumber(r, C.date, excelSerial(it.date));
      else if (dateAbs) sh.setFormula(r, C.date, dateAbs, serial);
      else sh.setNumber(r, C.date, serial);
      sh.setText(r, C.item, it.name);
      if (C.spec) sh.setText(r, C.spec, it.spec);
      var amt = round2(it.qty * it.price), vat = round2(amt * vatRate / 100);
      if (it.lump && C.amount) {
        // 금액만: 수량·단가 칸은 비우고 공급가액에 금액을 바로 넣는다
        sh.clearValue(r, C.qty);
        sh.clearValue(r, C.price);
        sh.setNumber(r, C.amount, amt);
      } else {
        sh.setNumber(r, C.qty, it.qty);
        sh.setNumber(r, C.price, it.price);
        if (C.amount) sh.setFormula(r, C.amount, qc + r + '*' + pc + r, amt);
      }
      if (C.vat) sh.setFormula(r, C.vat, (ac || qc + r + '*' + pc) + r + '*' + rateText(vatRate), vat);
      if (C.memo) sh.setText(r, C.memo, it.memo);
      supply += amt; vatSum += vat;
    }
    supply = round2(supply); vatSum = round2(vatSum);
    ['amount', 'vat'].forEach(function (f) {
      if (!C[f]) return;
      var s = b.span[f];
      sh.setFormula(b.totalRow, C[f], 'SUM(' + numToCol(s[0]) + b.itemStart + ':' + numToCol(s[1]) + b.itemEnd + ')', f === 'amount' ? supply : vatSum);
    });
    if (b.grandCell && C.amount && C.vat)
      sh.setFormula(b.grandCell.row, b.grandCell.col, ref(b.totalRow, C.amount) + '+' + ref(b.totalRow, C.vat), round2(supply + vatSum));
    return { supply: supply, vat: vatSum, total: round2(supply + vatSum) };
  }

  function fillCopy(sh, b, src, items, docDate, partnerText, totals) {
    if (b.dateCell && src.dateCell) sh.setFormula(b.dateCell.row, b.dateCell.col, ref(src.dateCell.row, src.dateCell.col), excelSerial(docDate));
    if (b.partnerCell && src.partnerCell) sh.setFormula(b.partnerCell.row, b.partnerCell.col, ref(src.partnerCell.row, src.partnerCell.col), partnerText);
    var C = b.col, serial = excelSerial(docDate);
    for (var r = b.itemStart; r <= b.itemEnd; r++) {
      var i = r - b.itemStart, it = items[i];
      if (!it) { Object.keys(C).forEach(function (f) { sh.clearValue(r, C[f]); }); continue; }
      var sr = src.itemStart + i;
      var amt = round2(it.qty * it.price);
      var cached = {
        date: it.date ? excelSerial(it.date) : serial, item: it.name, spec: it.spec, qty: it.qty, price: it.price,
        amount: amt, vat: totals.vatOf(it), memo: it.memo
      };
      Object.keys(C).forEach(function (f) {
        if (!src.col[f]) return;
        if (it.lump && (f === 'spec' || f === 'qty' || f === 'price')) { sh.clearValue(r, C[f]); return; }
        // 글자 칸은 &"" 를 붙여 빈칸이 0(-) 으로 보이지 않게
        var isText = f === 'item' || f === 'spec' || f === 'memo';
        sh.setFormula(r, C[f], ref(sr, src.col[f]) + (isText ? '&""' : ''), isText ? String(cached[f] || '') : cached[f]);
      });
    }
    ['amount', 'vat'].forEach(function (f) {
      if (!C[f] || !src.col[f]) return;
      sh.setFormula(b.totalRow, C[f], ref(src.totalRow, src.col[f]), f === 'amount' ? totals.supply : totals.vat);
    });
    if (b.grandCell && src.grandCell)
      sh.setFormula(b.grandCell.row, b.grandCell.col, ref(src.grandCell.row, src.grandCell.col), totals.total);
  }

  // 품목 행의 수량/단가/공급가액/세액 칸 스타일을 shrinkToFit 이 켜진 복제본으로 바꾼다
  function shrinkNumberCells(sh, st, blocks, count) {
    var root = st.documentElement, ns = root.namespaceURI || NS_MAIN, pre = root.prefix;
    var xfsParent = sh.child(root, 'cellXfs');
    if (!xfsParent) return false;
    // 한셀 저장 파일은 xf 를 mc:AlternateContent(Choice/Fallback) 로 감싸 두므로
    // 그 묶음 하나를 xf 하나로 센다 (엑셀이 읽는 Fallback 쪽을 사용)
    var xfs = [];
    for (var n = xfsParent.firstChild; n; n = n.nextSibling) {
      if (n.nodeType !== 1) continue;
      var ln = n.localName || n.nodeName.replace(/^.*:/, '');
      if (ln === 'xf') xfs.push(n);
      else if (ln === 'AlternateContent') {
        var pick = null;
        for (var m = n.firstChild; m; m = m.nextSibling) {
          if (m.nodeType !== 1) continue;
          var x = sh.child(m, 'xf');
          if (x && (!pick || (m.localName || m.nodeName.replace(/^.*:/, '')) === 'Fallback')) pick = x;
        }
        xfs.push(pick);
      }
    }
    var remap = {};
    function shrunk(s) {
      if (remap[s] != null) return remap[s];
      var src = xfs[s];
      if (!src) return s;
      var al = sh.child(src, 'alignment');
      if (al && al.getAttribute('shrinkToFit') === '1' && al.getAttribute('wrapText') !== '1') return (remap[s] = s);
      var xf = src.cloneNode(true);
      al = sh.child(xf, 'alignment');
      if (!al) {
        al = st.createElementNS(ns, pre ? pre + ':alignment' : 'alignment');
        xf.insertBefore(al, xf.firstChild);
      }
      al.setAttribute('shrinkToFit', '1');
      al.removeAttribute('wrapText');
      xf.setAttribute('applyAlignment', '1');
      xfsParent.appendChild(xf);
      xfs.push(xf);
      xfsParent.setAttribute('count', String(xfs.length));
      return (remap[s] = xfs.length - 1);
    }
    var changed = false;
    blocks.forEach(function (b) {
      ['qty', 'price', 'amount', 'vat'].forEach(function (f) {
        if (!b.col[f]) return;
        var rows = [];
        for (var r = b.itemStart; r < b.itemStart + count && r <= b.itemEnd; r++) rows.push(r);
        if (f === 'amount' || f === 'vat') rows.push(b.totalRow);
        rows.forEach(function (r) {
          var cell = sh.getCell(r, b.col[f], false);
          if (!cell) return;
          var s = +(cell.getAttribute('s') || 0), n = shrunk(s);
          if (n !== s) { cell.setAttribute('s', String(n)); changed = true; }
        });
      });
    });
    return changed;
  }

  // ---------- 패키지 (zip) 처리 ----------
  function parseXml(DOMParserImpl, text) { return new DOMParserImpl().parseFromString(text, 'application/xml'); }

  function readSharedStrings(DP, text) {
    if (!text) return [];
    var doc = parseXml(DP, text), out = [];
    var sis = doc.getElementsByTagNameNS(NS_MAIN, 'si');
    for (var i = 0; i < sis.length; i++) {
      var s = '';
      var ts = sis[i].getElementsByTagNameNS(NS_MAIN, 't');
      for (var j = 0; j < ts.length; j++) {
        var p = ts[j].parentNode, pl = p.localName || p.nodeName.replace(/^.*:/, '');
        if (pl === 'rPh') continue; // 윗주(읽는 법) 제외
        s += ts[j].textContent;
      }
      out.push(s);
    }
    return out;
  }

  function resolveTarget(base, target) {
    if (target.charAt(0) === '/') return target.slice(1);
    var parts = base.split('/'); parts.pop();
    target.split('/').forEach(function (p) { if (p === '..') parts.pop(); else if (p !== '.') parts.push(p); });
    return parts.join('/');
  }

  /**
   * opts: { zip: JSZip 생성자, DOMParser, XMLSerializer, date, partner, items, vatRate, outputType }
   * 반환: { data, summary }
   */
  async function generate(templateData, opts) {
    var JSZip = opts.JSZip, DP = opts.DOMParser, XS = opts.XMLSerializer;
    var vatRate = opts.vatRate == null || opts.vatRate === '' ? 10 : parseNumber(opts.vatRate);
    if (vatRate == null || vatRate < 0 || vatRate > 100) throw new Error('세율을 확인하세요 (0~100).');
    var docDate = parseDate(opts.date);
    if (!docDate) throw new Error('작성일을 입력하세요 (예: 2026-10-03)');
    var partner = String(opts.partner || '').trim();
    if (!partner) throw new Error('거래처 이름을 입력하세요.');
    var items = validateItems(opts.items, docDate);

    var zip = await JSZip.loadAsync(templateData);
    var wbXml = parseXml(DP, await zip.file('xl/workbook.xml').async('string'));
    var sheetEl = wbXml.getElementsByTagNameNS(NS_MAIN, 'sheet')[0];
    var rid = sheetEl.getAttributeNS(NS_REL, 'id') || sheetEl.getAttribute('r:id');
    var relsPath = 'xl/_rels/workbook.xml.rels';
    var rels = parseXml(DP, await zip.file(relsPath).async('string'));
    var sheetPath = null, calcChainRel = null;
    var relEls = rels.getElementsByTagNameNS(NS_PKG_REL, 'Relationship');
    for (var i = 0; i < relEls.length; i++) {
      var rel = relEls[i];
      if (rel.getAttribute('Id') === rid) sheetPath = resolveTarget('xl/workbook.xml', rel.getAttribute('Target'));
      if (/\/calcChain$/.test(rel.getAttribute('Type'))) calcChainRel = rel;
    }
    if (!sheetPath || !zip.file(sheetPath)) throw new Error('서식 파일에서 시트를 찾지 못했습니다.');

    var ssFile = zip.file('xl/sharedStrings.xml');
    var ss = readSharedStrings(DP, ssFile ? await ssFile.async('string') : '');
    var sh = new Sheet(parseXml(DP, await zip.file(sheetPath).async('string')), ss);

    var blocks = detectLayout(sh);
    var rowsAdded = 0;
    var need = items.length - blocks[0].capacity;
    if (need > 0) {
      // 아래 장부터 삽입해야 위 장 행 번호가 안 바뀐다
      for (var bi = blocks.length - 1; bi >= 0; bi--) {
        var b = blocks[bi];
        var extra = items.length - b.capacity;
        if (extra > 0) sh.insertRows(b.itemEnd + 1, extra, b.itemEnd);
      }
      rowsAdded = need;
      blocks = detectLayout(sh);
    }

    fillSupplier(sh, opts.supplier);
    var t = fillMain(sh, blocks[0], items, docDate, partner, vatRate);
    var partnerText = blocks[0].partnerCell ? sh.text(blocks[0].partnerCell.row, blocks[0].partnerCell.col) : partner;
    t.vatOf = function (it) { return round2(round2(it.qty * it.price) * vatRate / 100); };
    for (var k = 1; k < blocks.length; k++) fillCopy(sh, blocks[k], blocks[0], items, docDate, partnerText, t);

    // 숫자 칸이 좁아 ### 로 보이지 않게 '셀에 맞춤(자동 축소)'
    var stFile = zip.file('xl/styles.xml');
    if (stFile) {
      var st = parseXml(DP, await stFile.async('string'));
      if (shrinkNumberCells(sh, st, blocks, items.length)) zip.file('xl/styles.xml', new XS().serializeToString(st));
    }

    zip.file(sheetPath, new XS().serializeToString(sh.doc));

    // calcChain 제거 + 열 때 다시 계산
    if (calcChainRel) {
      var target = resolveTarget('xl/workbook.xml', calcChainRel.getAttribute('Target'));
      zip.remove(target);
      calcChainRel.parentNode.removeChild(calcChainRel);
      zip.file(relsPath, new XS().serializeToString(rels));
      var ct = parseXml(DP, await zip.file('[Content_Types].xml').async('string'));
      var ovs = ct.getElementsByTagNameNS(NS_CT, 'Override');
      for (var j = ovs.length - 1; j >= 0; j--)
        if ('/' + target === ovs[j].getAttribute('PartName')) ovs[j].parentNode.removeChild(ovs[j]);
      zip.file('[Content_Types].xml', new XS().serializeToString(ct));
    }
    var calcPr = wbXml.getElementsByTagNameNS(NS_MAIN, 'calcPr')[0];
    if (calcPr) calcPr.setAttribute('fullCalcOnLoad', '1');
    zip.file('xl/workbook.xml', new XS().serializeToString(wbXml));

    var data = await zip.generateAsync({ type: opts.outputType || 'uint8array', compression: 'DEFLATE',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    return {
      data: data,
      summary: {
        items: items.length, rowsAdded: rowsAdded, blocks: blocks.length,
        date: dateText(docDate), partner: partnerText, vatRate: vatRate,
        supply: t.supply, vat: t.vat, total: t.total
      }
    };
  }

  // ---------- 카톡 붙여넣기 파서 ----------
  // 거래처.품명.수량x단가 / 거래처.품명₩금액 / 거래처.품명₩단가x수량
  // 한 줄에 품목을 점으로 이어 써도 된다: 거래처.품명A.10x100.품명B₩5000.품명C.3x200
  var NUM = '(\\d[\\d,]*(?:\\.\\d+)?)';
  var X = '\\s*[xX*×]\\s*';
  // 품목 하나: 가장 짧은 품명 + (.수량x단가 | ₩금액[x수량]) + 뒤따르는 점(또는 줄 끝)
  var RE_SEG = new RegExp('^(.+?)(?:[.]\\s*' + NUM + '\\s*(?:개|ea|EA|Ea)?' + X + NUM + '\\s*(?:원)?' +
    '|\\s*[₩￦\\\\]\\s*' + NUM + '(?:' + X + NUM + ')?\\s*(?:원)?)\\s*(?:[.]|$)');
  var RE_Q = new RegExp('^(.*)[.]\\s*' + NUM + '\\s*(?:개|ea|EA|Ea)?\\s*$');
  // '품명.800x2500' 처럼 거래처 없이 바로 수량x단가가 오는 줄
  var RE_BARE = new RegExp('^' + NUM + '\\s*(?:개|ea|EA|Ea)?' + X + NUM + '\\s*(?:원)?\\s*(?:[.]|$)');

  function parsePaste(text) {
    var items = [], warnings = [], partners = [];
    // 휴대폰에서 복사한 글은 줄바꿈이 \r 단독이나 U+2028/2029 로 오기도 한다
    String(text || '').split(/\r\n|[\r\n\x85\v\f\u2028\u2029]/).forEach(function (raw, i) {
      var line = raw.replace(/ /g, ' ').trim();
      // 카톡 복사 시 붙는 "[이름] [오후 3:12] " 머리말 제거
      line = line.replace(/^\[[^\]]*\]\s*\[[^\]]*\]\s*/, '').trim();
      if (!line) return;
      var dot = line.indexOf('.');
      var partner = dot < 0 ? '' : line.slice(0, dot).trim();
      var rest = dot < 0 ? '' : line.slice(dot + 1).trim();
      // PC 버전과 같이: '거래처.품명' 이 아닌 줄은 쓰지 않는다
      if (!partner || !rest || RE_BARE.test(rest)) {
        warnings.push((i + 1) + '번째 줄: "거래처.품명..." 형식이 아니라 건너뛰었습니다 → "' + line + '"');
        return;
      }
      if (partners.indexOf(partner) < 0) partners.push(partner);
      // PC 버전과 같이 붙여넣은 품목의 규격은 EA
      // qty 가 '' 이면 '금액만' 품목 (규격·수량·단가 칸 비움)
      function add(name, qty, price) {
        items.push({ date: '', name: name, spec: qty === '' ? '' : 'EA', qty: qty, price: price, memo: '', partner: partner });
      }
      var m;
      while (rest && (m = RE_SEG.exec(rest))) {
        if (m[2] != null) add(m[1].trim(), parseNumber(m[2]), parseNumber(m[3]));
        else add(m[1].trim(), m[5] ? parseNumber(m[5]) : '', parseNumber(m[4]));
        rest = rest.slice(m[0].length).trim();
      }
      // 수량x단가 / ₩금액 을 못 읽은 나머지
      if (rest) {
        if ((m = RE_Q.exec(rest))) {
          add(m[1].trim(), parseNumber(m[2]), 0);
          warnings.push((i + 1) + '번째 줄: 단가를 읽지 못해 0원으로 넣었습니다 → "' + rest + '"');
        } else {
          add(rest, 1, 0);
          warnings.push((i + 1) + '번째 줄: 수량x단가를 읽지 못해 수량 1, 0원으로 넣었습니다 → "' + rest + '"');
        }
      }
    });
    if (partners.length > 1) {
      // PC 버전과 같이 첫 거래처의 품목만 쓴다
      var all = items.length;
      items = items.filter(function (it) { return it.partner === partners[0]; });
      warnings.push('거래처가 여러 개입니다 (' + partners.join(', ') + '). 첫 거래처 "' + partners[0] + '" 의 품목 ' +
        items.length + '개만 넣었습니다 (' + (all - items.length) + '개 제외). 다른 거래처는 따로 만드세요.');
    }
    return { partner: partners[0] || '', items: items, warnings: warnings };
  }

  return {
    generate: generate, parsePaste: parsePaste, parseDate: parseDate, parseNumber: parseNumber,
    mergePartnerName: mergePartnerName, excelSerial: excelSerial, _shiftFormula: shiftFormula
  };
});
</script>

  });
  $('template').value = load('template', '0');
  if (!$('template').value) $('template').value = '0';
  $('vat').value = load('vat', '10');
  $('template').addEventListener('change', function(){ save('template', this.value); });
  $('vat').addEventListener('change', function(){ save('vat', this.value); renderTotals(); });
  $('vat').addEventListener('input', renderTotals);

  // ---------- 우리 회사(공급자) 정보 ----------
  var SUP_KEYS = ['name','ceo','regno','addr','biz','kind','tel','email'];
  var sup = {}; try { sup = JSON.parse(load('supplier', '{}')) || {}; } catch(e){ sup = {}; }
  function supFilled(){ return SUP_KEYS.some(function(k){ return String(sup[k]||'').trim(); }); }
  function supState(){
    $('sup-state').textContent = supFilled() ? '· 입력됨' : (SAMPLE_SUPPLIER ? '· 입력하세요' : '· 서식 그대로');
    $('sup-state').style.color = !supFilled() && SAMPLE_SUPPLIER ? 'var(--err)' : '';
  }
  SUP_KEYS.forEach(function(k){
    var el = $('sup-'+k); el.value = sup[k] || '';
    el.addEventListener('input', function(){ sup[k] = el.value; save('supplier', JSON.stringify(sup)); supState(); });
  });
  if (SAMPLE_SUPPLIER && !supFilled()) $('sup-box').open = true;
  supState();
  // 엔진에 넘길 값: 전화번호 칸에는 서식처럼 "전화 ↵ E-Mail : 메일"
  function supplierOpt(){
    if (!supFilled()) return null;
    var o = {}; SUP_KEYS.forEach(function(k){ o[k] = String(sup[k]||'').trim(); });
    if (o.email) o.tel = (o.tel ? o.tel + '\n' : '') + 'E-Mail : ' + o.email;
    if (o.addr) o.addr = ' ' + o.addr + ' ';   // 서식 원래처럼 양옆 한 칸
    delete o.email;
    return o;
  }

  // ---------- 탭 ----------
  function tab(which){
    $('tab-paste').setAttribute('aria-selected', which==='paste');
    $('tab-manual').setAttribute('aria-selected', which==='manual');
    $('pane-paste').hidden = which!=='paste';
    $('pane-manual').hidden = which!=='manual';
  }
  $('tab-paste').onclick = function(){ tab('paste'); };
  $('tab-manual').onclick = function(){ tab('manual'); if(!items.length){ addItem(); } };

  // ---------- 붙여넣기 ----------
  var timer = null;
  function parseNow(){
    var text = $('paste').value;
    if (!text.trim()) { msg($('paste-msg'), '', ''); return; }
    var r = E.parsePaste(text);
    items = r.items.map(function(it){ return { date:'', name:it.name, spec:it.spec, qty:it.qty, price:it.price, memo:'' }; });
    if (r.partner) $('partner').value = r.partner;
    render();
    var lines = [];
    if (r.warnings.length) lines = lines.concat(r.warnings);
    msg($('paste-msg'), r.warnings.length ? 'warn' : 'ok', lines.length ? lines.join('\n') : ('✓ 품목 '+items.length+'개를 읽었습니다.'));
  }
  $('paste').addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(parseNow, 250); });
  $('btn-clear').onclick = function(){ $('paste').value=''; $('partner').value=''; items=[]; render(); msg($('paste-msg'),'',''); };
  $('btn-clip').onclick = function(){
    var done = function(t){ if(t){ $('paste').value = t; parseNow(); } else msg($('paste-msg'),'warn','클립보드가 비어 있습니다. 입력칸을 길게 눌러 [붙여넣기] 하세요.'); };
    try{
      if (bridge && bridge.readClipboard) { done(bridge.readClipboard()); return; }
      navigator.clipboard.readText().then(done, function(){ msg($('paste-msg'),'warn','입력칸을 길게 눌러 [붙여넣기] 하세요.'); });
    }catch(e){ msg($('paste-msg'),'warn','입력칸을 길게 눌러 [붙여넣기] 하세요.'); }
  };

  // ---------- 품목 목록 ----------
  function addItem(){ items.push({date:'',name:'',spec:'',qty:'',price:'',memo:''}); render();
    var all = document.querySelectorAll('[data-k="name"]'); if (all.length) all[all.length-1].focus(); }
  $('btn-add').onclick = addItem;

  // 수량을 비우면 '금액만' 품목: 단가 칸 값이 곧 공급가액
  function isLump(it){ return String(it.qty==null?'':it.qty).trim()==='' && E.parseNumber(it.price)!=null; }
  function amountOf(it){ var q=isLump(it)?1:E.parseNumber(it.qty), p=E.parseNumber(it.price); return (q==null||p==null)?0:q*p; }

  function render(){
    var box = $('items');
    if (!items.length){ box.innerHTML = '<div class="empty">아직 품목이 없습니다. 카톡 문장을 붙여넣거나 [+ 품목 추가] 를 누르세요.</div>'; }
    else box.innerHTML = items.map(function(it, i){
      return '<div class="item" data-i="'+i+'">'+
        '<div class="item-top"><span>'+(i+1)+'번 · 공급가액 <b data-amt>'+won(amountOf(it))+'</b>원</span><button class="del" data-del="'+i+'">삭제</button></div>'+
        '<div class="field"><label>품명 *</label><input data-k="name" value="'+esc(it.name)+'"></div>'+
        '<div class="grid2 field"><div><label>수량 <span style="font-weight:normal">(비우면 금액만)</span></label><input data-k="qty" inputmode="decimal" value="'+esc(it.qty)+'"></div>'+
        '<div><label>단가 (금액) *</label><input data-k="price" inputmode="decimal" value="'+esc(it.price)+'"></div></div>'+
        '<details'+((it.spec && it.spec!=='EA')||it.memo||it.date?' open':'')+'><summary>규격 · 월일 · 비고 (선택)</summary>'+
        '<div class="grid3"><div><label>규격</label><input data-k="spec" value="'+esc(it.spec)+'"></div>'+
        '<div><label>월일</label><input data-k="date" placeholder="10/3" value="'+esc(it.date)+'"></div>'+
        '<div><label>비고</label><input data-k="memo" value="'+esc(it.memo)+'"></div></div></details>'+
      '</div>';
    }).join('');
    $('count').textContent = items.length ? '('+items.length+'개)' : '';
    renderTotals();
    saveDraft();
  }
  $('items').addEventListener('input', function(e){
    var k = e.target.getAttribute('data-k'); if(!k) return;
    var card = e.target.closest('.item'); var i = +card.getAttribute('data-i');
    items[i][k] = e.target.value; saveDraft();
    if (k==='qty'||k==='price') { card.querySelector('[data-amt]').textContent = won(amountOf(items[i])); renderTotals(); }
  });
  $('items').addEventListener('click', function(e){
    var d = e.target.getAttribute('data-del'); if (d==null) return;
    items.splice(+d, 1); render();
  });
  function renderTotals(){
    var rate = E.parseNumber($('vat').value); if (rate==null) rate = 10;
    var s = 0, v = 0;
    items.forEach(function(it){ var a = Math.round(amountOf(it)*100)/100; s += a; v += Math.round(a*rate)/100; });
    $('totals').innerHTML = items.length ?
      '<dt>공급가액</dt><dd>'+won(s)+' 원</dd><dt>세액 ('+rate+'%)</dt><dd>'+won(v)+' 원</dd><dt class="grand">합계금액</dt><dd class="grand">'+won(s+v)+' 원</dd>' : '';
  }

  // ---------- 만들기 ----------
  function b64ToBytes(b64){ var bin = atob(b64), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function bytesToB64(u){ var s='', CH=0x8000; for (var i=0;i<u.length;i+=CH) s += String.fromCharCode.apply(null, u.subarray(i,i+CH)); return btoa(s); }
  function safeName(s){ return String(s).replace(/[\\\/:*?"<>|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,40); }

  $('btn-gen').onclick = function(){
    var btn = this; btn.disabled = true; btn.textContent = '만드는 중…';
    msg($('gen-msg'),'',''); $('result').hidden = true; last = null;
    var tpl = TEMPLATES[+$('template').value] || TEMPLATES[0];
    var partner = $('partner').value.trim();
    Promise.resolve().then(function(){
      return E.generate(b64ToBytes(tpl.data), {
        JSZip: window.JSZip, DOMParser: window.DOMParser, XMLSerializer: window.XMLSerializer,
        date: $('date').value, partner: partner, items: items, vatRate: $('vat').value, supplier: supplierOpt()
      });
    }).then(function(r){
      var s = r.summary;
      var name = '거래명세표_' + safeName(partner) + '_' + s.date.replace(/-/g,'') + '.xlsx';
      last = { name: name, b64: bytesToB64(r.data), data: r.data };
      $('r-name').textContent = name;
      $('r-where').textContent = '품목 '+s.items+'개 · 합계 '+won(s.total)+'원' + (s.rowsAdded ? ' · 행 '+s.rowsAdded+'개 자동 추가' : '') +
        (SAMPLE_SUPPLIER && !supFilled() ? '\n⚠ 우리 회사 정보가 비어 있어 공급자 칸에 예시(㈜샘플회사)가 들어갔습니다. 위 [우리 회사 정보] 를 채워 주세요.' : '');
      $('result').hidden = false;
      saveFile(true);
      $('result').scrollIntoView({behavior:'smooth', block:'start'});
    }).catch(function(e){
      msg($('gen-msg'),'err', e && e.message ? e.message : String(e));
      $('gen-msg').scrollIntoView({behavior:'smooth', block:'center'});
    }).then(function(){ btn.disabled = false; btn.textContent = '거래명세표 만들기'; });
  };

  function saveFile(first){
    if (!last) return;
    if (bridge) {
      var res = {}; try { res = JSON.parse(bridge.saveFile(last.b64, last.name)); } catch(e){ res = {ok:false, error:String(e)}; }
      if (res.ok) $('r-where').textContent += first ? ('\n저장 위치: ' + res.where) : '';
      else msg($('gen-msg'),'err','저장 실패: ' + res.error);
      if (!first && res.ok) msg($('gen-msg'),'ok','다시 저장했습니다: ' + res.where);
      return;
    }
    // 아이폰: 만들자마자 내려받으면 "다운로드할까요?" 창이 떠서 번거로움 → [공유] 로 카톡·파일에 저장
    if (ios && first) { $('r-where').textContent += '\n[공유 · 파일에 저장] → 카카오톡으로 보내거나, [파일에 저장] 을 고르세요.'; return; }
    var blob = new Blob([last.data], {type:XLSX_TYPE});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = last.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
    if (first) $('r-where').textContent += '\n다운로드 폴더에 저장됩니다.';
    else if (ios) msg($('gen-msg'),'ok','파일 앱 > 다운로드 폴더에 저장됩니다.');
  }
  if (ios) {
    // 공유 시트에 카카오톡·파일에 저장·Excel/Numbers 로 열기가 다 있으므로 [열기] 는 숨김
    $('btn-open').hidden = true;
    $('btn-share').textContent = '공유 · 파일에 저장';
    $('btn-save').textContent = '다운로드';
  }
  $('btn-save').onclick = function(){ saveFile(false); };
  $('btn-open').onclick = function(){
    if (!last) return;
    if (bridge) { var r = JSON.parse(bridge.openFile(last.b64, last.name)); if (!r.ok) msg($('gen-msg'),'err', r.error); return; }
    var blob = new Blob([last.data], {type:XLSX_TYPE});
    window.open(URL.createObjectURL(blob));
  };
  $('btn-share').onclick = function(){
    if (!last) return;
    if (bridge) { var r = JSON.parse(bridge.shareFile(last.b64, last.name)); if (!r.ok) msg($('gen-msg'),'err', r.error); return; }
    try {
      var f = new File([last.data], last.name, {type:XLSX_TYPE});
      if (navigator.canShare && navigator.canShare({files:[f]})) { navigator.share({files:[f]}).catch(function(){}); return; }
    } catch(e){}
    msg($('gen-msg'),'warn', ios ? '공유가 안 됩니다. [다운로드] 를 누른 뒤 파일 앱 > 다운로드 에서 카톡으로 보내세요.'
                                 : '이 브라우저는 바로 공유가 안 됩니다. 다운로드 폴더의 파일을 카톡에서 첨부하세요.');
  };

  // 앱(APK): 카톡에서 [공유] → 거래명세표 로 보낸 글
  window.receiveSharedText = function(text){
    if (!text) return;
    tab('paste'); $('paste').value = text; parseNow();
  };

  // ---------- 작성 중인 내용 자동 보관 (앱을 다시 열어도 유지) ----------
  function saveDraft(){
    save('draft', JSON.stringify({ partner: $('partner').value, paste: $('paste').value, items: items }));
  }
  $('partner').addEventListener('input', saveDraft);
  $('paste').addEventListener('input', saveDraft);
  try {
    var d = JSON.parse(load('draft', 'null'));
    if (d) {
      $('partner').value = d.partner || '';
      $('paste').value = d.paste || '';
      if (Array.isArray(d.items)) items = d.items;
    }
  } catch(e){}

  render();
})();
</script>
<script>
// 한 번 열면 인터넷 없이도 열리도록 저장 (https 에서만 동작)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
